# Pull request titles follow Conventional Commits, type(scope): description
# with the scope optional, and have at most 72 characters.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the title
        env:
          # Through the environment, never written into the script: the title is
          # text anyone opening a pull request can choose.
          TITLE: ${{ github.event.pull_request.title }}
          LC_ALL: C.UTF-8
        run: |
          re='^(feat|fix|docs|refactor|test|ci|chore|perf|build)(\([a-z0-9._-]+\))?!?: [^[:space:]]'
          if ! [[ $TITLE =~ $re ]]; then
            echo "::error::The title must look like type(scope): description, e.g. \"fix(config): keep comments on reload\". Types: feat, fix, docs, refactor, test, ci, chore, perf, build"
            exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::error::The title has ${#TITLE} characters, at most 72 are allowed"
            exit 1
          fi
