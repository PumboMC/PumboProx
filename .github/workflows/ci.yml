name: ci

# "check" runs tools/ci-local.sh on Linux; release.yml waits for it, so it
# stays one job named check (a matrix would rename it). The repository is
# public, so the macOS and Windows jobs cost no minutes. The release targets
# (Windows, macOS, Linux aarch64 and musl) are built by release.yml on a tag,
# or by hand with its Run workflow button before tagging.
on:
  # Other branches run through their pull requests; tags through release.yml.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Without debug info in test builds; with it the runner disk fills up.
  CARGO_PROFILE_DEV_DEBUG: 0
  # A new Rust brings new lints, so it comes in its own update, not on every branch at once.
  # renovate: datasource=github-releases depName=rust-lang/rust
  RUST_VERSION: 1.99.1
  # Fuzz targets need nightly; a dated one, for the same reason.
  RUST_NIGHTLY: nightly-2026-10-07
  # renovate: datasource=crate depName=cargo-deny
  CARGO_DENY_VERSION: 0.20.2
  # renovate: datasource=crate depName=cargo-fuzz
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  check:
    runs-on: ubuntu-24.04
    # The slowest run so far took 25 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c rustfmt,clippy -t wasm32-wasip2
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo-deny
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
      - name: CI steps
        run: tools/ci-local.sh

  # The oldest Rust that Cargo.toml promises (rust-version).
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # An older compiler warns about lints it does not know yet.
      RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: rustup toolchain install 1.96.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo +1.96.0 check --workspace --locked

  # The fuzz targets still build (they run in fuzz.yml).
  fuzz-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust nightly and cargo-fuzz
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal
          cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - working-directory: fuzz
        run: cargo "+$RUST_NIGHTLY" fuzz build -O

  # Build and tests on macOS, as ci-local.sh runs them without the wasm spike.
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -t wasm32-wasip2
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tests
        run: |
          # macOS allows 256 open files by default; the e2e tests hold 3000 connections.
          ulimit -n 10240
          cargo test --workspace --locked --exclude spike-wasm-async

  # Windows: the protocol, the proxy's own tests, its config and the e2e tests.
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # aws-lc-sys uses its bundled NASM objects, no NASM install.
      AWS_LC_SYS_PREBUILT_NASM: 1
      # Lints are checked on Linux; code only Windows builds must not fail here on a warning.
      RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -t wasm32-wasip2
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked -p pumbo-protocol
      - run: cargo test --locked -p pumbo-prox --lib --test config --test e2e

  # Generator tables (plan §2.5): every release from 1.21 on, run on demand.
  # The committed tables must come out byte for byte the same.
  datagen:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Never run yet; the downloads and the vanilla servers take most of it.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pumbo-datagen
          key: pumbo-datagen-${{ hashFiles('crates/pumbo-data/tables/*/meta.txt') }}
          restore-keys: pumbo-datagen-
      - run: cargo run -p pumbo-datagen --release --locked -- tables
      - run: git diff --exit-code crates/pumbo-data/tables
      - run: cargo test -p pumbo-datagen -p pumbo-data --locked -- --nocapture
      # Recordings of vanilla servers (plan §2.5, E2): synced.txt must not change,
      # the codec must round-trip every recorded packet, and translation for older
      # clients and the virtual world's chunks are checked against them.
      - run: cargo run -p pumbo-datagen --release --locked -- record
      - run: git diff --exit-code crates/pumbo-data/tables
      - name: Tests on the recordings
        env:
          PUMBO_REQUIRE_RECORDINGS: '1'
        run: |
          cargo test -p pumbo-testclient --locked --test golden -- --nocapture
          cargo test -p pumbo-translate --locked --test golden -- --nocapture
          cargo test -p pumbo-virtual --locked --test sections -- --nocapture
