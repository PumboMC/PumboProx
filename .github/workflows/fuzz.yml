name: fuzz

# Fuzzing (plan E2): the frame decoder, the packet decoders of every phase,
# NBT and text parsers, version translation and bridge frames, one hour each.
# By hand only.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_NIGHTLY: nightly-2026-10-07
  # renovate: datasource=crate depName=cargo-fuzz
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    # One hour of fuzzing after the build.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [frame, handshake_status, login, configuration, play, nbt, text, translate, bridge_wire]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust nightly and cargo-fuzz
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal
          cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: fuzz for one hour
        working-directory: fuzz
        run: cargo "+$RUST_NIGHTLY" fuzz run ${{ matrix.target }} -O -- -max_total_time=3600 -rss_limit_mb=2048 -timeout=10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
