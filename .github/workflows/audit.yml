name: audit

# RustSec advisories change from day to day: checked in ci.yml, a new one would
# fail every branch with nothing changed in the repository. They run here
# instead: daily, when the dependencies change, and with the Run workflow
# button. tools/ci-local.sh checks bans, licenses and sources.
on:
  schedule:
    - cron: '23 5 * * *'
  push:
    branches: [main]
    paths: [Cargo.lock, '**/Cargo.toml', deny.toml, .github/workflows/audit.yml]
  pull_request:
    paths: [Cargo.lock, '**/Cargo.toml', deny.toml, .github/workflows/audit.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=rust-lang/rust
  RUST_VERSION: 1.99.0
  # renovate: datasource=crate depName=cargo-deny
  CARGO_DENY_VERSION: 0.20.2

jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo-deny
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
      - run: cargo deny --locked check advisories
