name: release

# A tag v* waits for a green "check" from ci.yml on the tagged commit (so tag
# a commit on main) and for the backend tests of backends.yml, builds
# pumboprox for every platform, publishes a GitHub Release with the archives
# and SHA256SUMS (a tag with "-" is a pre-release) and pushes the Docker
# image. Run by hand (Run workflow) it only builds, to check the platforms
# before tagging.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # The same Rust as ci.yml.
  # renovate: datasource=github-releases depName=rust-lang/rust
  RUST_VERSION: 1.99.0

jobs:
  verify:
    name: verify CI
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      checks: read
    steps:
      - name: Green check for the tagged commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest "check" run of ci.yml for this commit; one still running is waited for.
          while :; do
            last=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=check" \
              --jq '.check_runs | sort_by(.id) | last | if . then .status + " " + (.conclusion // "") else "" end')
            case $last in
              '') echo "::error::no CI check for $GITHUB_SHA: push the commit to main and tag it after CI passes"; exit 1 ;;
              'completed success') echo "CI check passed for $GITHUB_SHA"; exit 0 ;;
              completed*) echo "::error::CI check for $GITHUB_SHA: ${last#completed }; re-run CI for it, then the release"; exit 1 ;;
            esac
            echo "CI check: $last, waiting"
            sleep 30
          done

  # Real Pumpkin servers and the released plugins on the tagged commit.
  backends:
    if: github.event_name == 'push'
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/backends.yml

  build:
    name: build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    # The slowest build so far took 24 minutes.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.28 and newer (Debian 10, Ubuntu 20.04, RHEL 8), cross-built with zig.
          - { name: linux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, glibc: .2.28, run: true }
          - { name: linux-aarch64, os: ubuntu-24.04, target: aarch64-unknown-linux-gnu, glibc: .2.28 }
          # Static, for any distribution; the Docker image is made from these.
          - { name: linux-x86_64-musl, os: ubuntu-24.04, target: x86_64-unknown-linux-musl, run: true }
          - { name: linux-aarch64-musl, os: ubuntu-24.04, target: aarch64-unknown-linux-musl }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, run: true }
          # Cross-built on x64; aws-lc-sys compiles with clang-cl from the runner's Visual Studio.
          - { name: windows-aarch64, os: windows-latest, target: aarch64-pc-windows-msvc }
          - { name: macos-universal, os: macos-14, target: aarch64-apple-darwin x86_64-apple-darwin, run: true }
    defaults:
      run:
        shell: bash
    env:
      # Windows x86_64: aws-lc-sys uses its bundled NASM objects, no NASM install.
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}
      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-zigbuild
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-about@0.9.2
      - name: Build and pack
        run: |
          dir=pumboprox-${{ matrix.name }}
          mkdir "$dir"
          case $RUNNER_OS in
            Linux)
              cargo zigbuild --release --locked -p pumbo-prox --target ${{ matrix.target }}${{ matrix.glibc }}
              cp target/${{ matrix.target }}/release/pumboprox "$dir" ;;
            Windows)
              cargo build --release --locked -p pumbo-prox --target ${{ matrix.target }}
              cp target/${{ matrix.target }}/release/pumboprox.exe "$dir" ;;
            macOS)
              cargo build --release --locked -p pumbo-prox --target aarch64-apple-darwin --target x86_64-apple-darwin
              lipo -create -output "$dir/pumboprox" target/{aarch64,x86_64}-apple-darwin/release/pumboprox
              # The Pumbo icon in Finder; tar keeps it (as extended attributes).
              osascript -l JavaScript -e "ObjC.import('AppKit'); \$.NSWorkspace.sharedWorkspace.setIconForFileOptions(\$.NSImage.alloc.initWithContentsOfFile('$PWD/crates/pumbo-prox/pumboprox-icon.png'), '$PWD/$dir/pumboprox', 0)" ;;
          esac
          if [ "${{ matrix.run }}" = true ]; then
            bin=$PWD/$dir/pumboprox
            "$bin" version
            # The first start in an empty folder writes the default config, which check-config must accept.
            (cd "$(mktemp -d)" && echo stop | "$bin" run && "$bin" check-config)
          fi
          cp LICENSE crates/pumbo-translate-mv/NOTICE "$dir"
          cp -R crates/pumbo-translate-mv/licenses "$dir"
          cargo about generate --locked --fail -c about.toml -m crates/pumbo-prox/Cargo.toml \
            -o "$dir/THIRD-PARTY-LICENSES.txt" about.hbs
          # README.md lives in PumboMC/PumboProx, not in the development monorepo.
          if [ -f README.md ]; then cp README.md "$dir"; fi
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$dir.zip" "$dir"; else tar czf "$dir.tar.gz" "$dir"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: pumboprox-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 3

  release:
    if: github.event_name == 'push'
    needs: [build, backends]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum pumboprox-* > SHA256SUMS
          # Only a stable tag (no "-" in the version) becomes the latest release.
          case $GITHUB_REF_NAME in
            *-*) kind=(--prerelease --latest=false) ;;
            *) kind=(--latest) ;;
          esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            "${kind[@]}" pumboprox-* SHA256SUMS

  docker:
    if: github.event_name == 'push'
    needs: [build, backends]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-musl'
          merge-multiple: true
      - name: Binaries and tags
        id: meta
        run: |
          mkdir image
          for a in x86_64:amd64 aarch64:arm64; do
            tar xzf "pumboprox-linux-${a%:*}-musl.tar.gz"
            mv "pumboprox-linux-${a%:*}-musl/pumboprox" "image/pumboprox-${a#*:}"
          done
          (cd pumboprox-linux-x86_64-musl && cp -R LICENSE NOTICE licenses THIRD-PARTY-LICENSES.txt ../image)
          name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pumboprox
          tags=$name:${GITHUB_REF_NAME#v}
          # latest follows stable releases only, beta the pre-releases.
          case $GITHUB_REF_NAME in
            *-*) tags+=,$name:beta ;;
            *) tags+=,$name:latest ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: pumboprox:smoke
      - name: Smoke test
        run: |
          docker run --rm pumboprox:smoke version
          # The first start writes the default config into /data, which check-config must accept.
          mkdir smoke
          image() { docker run --rm -i -v "$PWD/smoke:/data" --user "$(id -u):$(id -g)" pumboprox:smoke "$@"; }
          echo stop | image
          image check-config
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
