# Dependency policy (plan §1). `cargo deny check` in CI.

[graph]
all-features = false
# Release targets (plan §1, E12). Without this, target-specific dependencies of
# other platforms count too (e.g. webpki-root-certs, CDLA-Permissive-2.0, which
# rustls-platform-verifier uses only on wasm32).
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]

[licenses]
# Allowed licenses (plan §1). The project itself is GPL-3.0-only (2026-10-08). aws-lc-sys 0.45 declares ISC, Apache-2.0, MIT,
# BSD-3-Clause and MIT-0 (no OpenSSL license), checked in E0.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# Own, independent code (plan §0.1): crates of these projects must not become dependencies.
deny = [
    { name = "pumpkin-protocol" },
    { name = "pumpkin-data" },
    { name = "pumpkin-plugin-api" },
    { name = "pumpkin-util" },
    { name = "pumpkin-world" },
    { name = "pumpkin-nbt" },
    { name = "pumpkin-config" },
    { name = "valence_protocol" },
    { name = "azalea-protocol" },
    # Marvin (RUSTSEC-2023-0071); RSA only through aws-lc-rs (§9 item 6).
    { name = "rsa" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
yanked = "deny"
