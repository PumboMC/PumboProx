# THIRD-PARTY-LICENSES.txt for the release archives and the Docker image:
#   cargo about generate --locked --fail -c about.toml -m crates/pumbo-prox/Cargo.toml \
#     -o THIRD-PARTY-LICENSES.txt about.hbs
# `accepted` is the `[licenses] allow` list of deny.toml; a test keeps them equal.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]
# Every release target, so one file covers every archive.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
private = { ignore = true }
